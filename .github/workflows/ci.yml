name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request runs are cancelled; every main commit keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.10.2"

jobs:
  macos-native:
    runs-on: macos-26
    # The 6-hour default lets a hung run block the queue and delay every result.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS shell
        # The Apple build-tool plugin is exactly pinned in the project and Package.resolved.
        run: >-
          xcodebuild -jobs 2 -skipPackagePluginValidation -project apps/macos/TAMForge.xcodeproj -scheme TAMForge
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test native client transport
        run: >-
          xcodebuild -jobs 2 -skipPackagePluginValidation -project apps/macos/TAMForge.xcodeproj -scheme TAMForge
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
          -only-testing:TAMForgeTests
          -retry-tests-on-failure -test-iterations 3 test
      - name: Build signed standalone Release app
        run: >-
          xcodebuild -jobs 2 -skipPackagePluginValidation
          -project apps/macos/TAMForge.xcodeproj -scheme TAMForge
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TAMForgeRelease"
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual build
      - name: Verify Release signature, contents, and fixture exclusion
        run: >-
          python3 scripts/ci/check_native_bundle.py
          "$RUNNER_TEMP/TAMForgeRelease/Build/Products/Release/TAMForge.app"
          --require-ad-hoc

  native-ui:
    runs-on: macos-26
    # The 6-hour default lets a hung run block the queue and delay every result.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run complete native UI target with ad-hoc signing
        run: >-
          xcodebuild -jobs 2 -skipPackagePluginValidation
          -project apps/macos/TAMForge.xcodeproj -scheme TAMForge
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual
          -only-testing:TAMForgeUITests
          -skip-testing:TAMForgeUITests/TAMForgeUITests/testLocalNativeResourceReceipt
          -retry-tests-on-failure -test-iterations 3
          -resultBundlePath "$RUNNER_TEMP/TAMForgeUITests.xcresult" test
      - name: Require every native UI journey to pass
        run: >-
          python3 scripts/ci/check_native_xcresult.py
          "$RUNNER_TEMP/TAMForgeUITests.xcresult"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-xcresult
          path: ${{ runner.temp }}/TAMForgeUITests.xcresult
          retention-days: 7

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run ruff check .
      # Structural and privacy check only; live runtime evidence is never
      # implied by a report that merely parses.
      - run: uv run python scripts/ci/check_recording_verification.py docs/project/recording-verification-v1.json
      - run: uv run mypy apps/backend/src packages/protocol/src
      - run: MYPYPATH=apps/backend/src:packages/protocol/src uv run mypy scripts/ci/check_openapi.py scripts/ci/check_repository_policy.py scripts/ci/verify_bootstrap.py scripts/ci/verify_compose.py scripts/dev/seed_foundation_demo.py
      - run: uv run python -m scripts.ci.verify_bootstrap
      - run: uv run pytest apps/backend/tests/unit apps/backend/tests/security apps/backend/tests/recordings packages/protocol/tests scripts/ci/tests scripts/dev/tests scripts/github/tests -m "not integration" -q

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tamforge_test
          POSTGRES_USER: tamforge
          POSTGRES_PASSWORD: tamforge
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tamforge -d tamforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tamforge:tamforge@127.0.0.1:54329/tamforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://tamforge:tamforge@127.0.0.1:54329/tamforge_test
      TAMFORGE_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      TAMFORGE_OBJECT_STORE_BUCKET: tam-forge-parity-test
      TAMFORGE_OBJECT_STORE_ACCESS_KEY: tamforge
      TAMFORGE_OBJECT_STORE_SECRET_KEY: tamforge-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Start isolated MinIO for durable parity
        run: >-
          docker run --detach --rm --name tam-forge-parity-minio
          --publish 127.0.0.1:9000:9000
          --env MINIO_ROOT_USER=tamforge
          --env MINIO_ROOT_PASSWORD=tamforge-local
          minio/minio:RELEASE.2024-06-13T22-53-53Z
          server /data
      - name: Wait for isolated MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: uv run alembic -c apps/backend/alembic.ini upgrade head
      - run: uv run pytest -m "integration and not postgres_integration" apps/backend/tests/integration -q
      - name: Require complete model provenance PostgreSQL coverage
        run: scripts/run-plan-03-integration.sh apps/backend/tests/integration/agents

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tamforge_test
          POSTGRES_USER: tamforge
          POSTGRES_PASSWORD: tamforge
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tamforge -d tamforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tamforge:tamforge@127.0.0.1:54329/tamforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://tamforge:tamforge@127.0.0.1:54329/tamforge_test
      TAMFORGE_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      TAMFORGE_OBJECT_STORE_BUCKET: tam-forge-parity-test
      TAMFORGE_OBJECT_STORE_ACCESS_KEY: tamforge
      TAMFORGE_OBJECT_STORE_SECRET_KEY: tamforge-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Start isolated MinIO
        run: >-
          docker run --detach --rm --name tam-forge-e2e-minio
          --publish 127.0.0.1:9000:9000
          --env MINIO_ROOT_USER=tamforge
          --env MINIO_ROOT_PASSWORD=tamforge-local
          minio/minio:RELEASE.2024-06-13T22-53-53Z
          server /data
      - name: Wait for isolated MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: uv run alembic -c apps/backend/alembic.ini upgrade head
      - run: uv run pytest -m integration apps/backend/tests/integration/foundation/test_month1_workspace.py -q

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run python scripts/ci/check_openapi.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run python scripts/ci/check_repository_policy.py
