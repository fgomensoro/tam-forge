milestones:
- key: M0
  title: M0 — Safe Foundation
  description: Private repo, CI, auth, Postgres/object abstractions, backup rehearsal, roadmap import, universal activity
    workspace, evidence ledger
- key: M1
  title: M1 — Closed Spoken Loop
  description: Durable dual-track Attempt A, self-review lock, local transcript/metrics/pronunciation diagnostic, evidence-backed
    review, exactly two corrections, Attempt B
- key: M2
  title: M2 — Persistent Agents and Interviews
  description: Subscription-only Agent SDK, role tools/memory, turn interviewer, opportunities, consent/redaction real-interview
    workflow
- key: M3
  title: M3 — Complete Month 1 Workspace
  description: Specialized SQL, reading, cases, writing, career, portfolio, reports, weekly/month transition behavior
- key: M4
  title: M4 — Production and Portability
  description: Dedicated hardened server, restore-tested backups, complete export, optional OKF, failure/security/evaluation
    gates, release runbook
