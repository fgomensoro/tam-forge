version: 1
repository: fgomensoro/tam-forge

labels:
  - name: "type/epic"
    color: "5319E7"
    description: "Parent tracking issue"
  - name: "type/feature"
    color: "1D76DB"
    description: "User-visible behavior"
  - name: "type/infrastructure"
    color: "0052CC"
    description: "Deployment/storage/operations"
  - name: "type/security"
    color: "B60205"
    description: "Authentication/privacy/hardening"
  - name: "type/evaluation"
    color: "FBCA04"
    description: "Quality or reliability measurement"
  - name: "area/backend"
    color: "0E8A16"
    description: "FastAPI/domain/worker work"
  - name: "area/web"
    color: "1D76DB"
    description: "React client work"
  - name: "area/recorder"
    color: "C5DEF5"
    description: "macOS recorder work"
  - name: "area/speech"
    color: "D4C5F9"
    description: "Audio/transcript/metrics work"
  - name: "area/agents"
    color: "7057FF"
    description: "Agent SDK/prompts/tools/memory work"
  - name: "area/curriculum"
    color: "BFDADC"
    description: "Roadmap/study/evidence work"
  - name: "area/operations"
    color: "006B75"
    description: "Production/backup/export work"
  - name: "gate/destructive"
    color: "D93F0B"
    description: "Requires explicit destructive approval"
  - name: "gate/privacy"
    color: "B60205"
    description: "Requires privacy contract verification"
  - name: "gate/spend"
    color: "E99695"
    description: "Requires approval before new cost"
  - name: "gate/docker-local"
    color: "F9D0C4"
    description: "Requires explicit approval before local Docker/Testcontainers"
  - name: "status/blocked"
    color: "000000"
    description: "Cannot progress without a named gate/input"

milestones:
  - key: "M0"
    title: "M0 — Safe Foundation"
    description: "Private repo, CI, auth, Postgres/object abstractions, backup rehearsal, roadmap import, universal activity workspace, evidence ledger"
  - key: "M1"
    title: "M1 — Closed Spoken Loop"
    description: "Durable dual-track Attempt A, self-review lock, local transcript/metrics/pronunciation diagnostic, evidence-backed review, exactly two corrections, Attempt B"
  - key: "M2"
    title: "M2 — Persistent Agents and Interviews"
    description: "Subscription-only Agent SDK, role tools/memory, turn interviewer, opportunities, consent/redaction real-interview workflow"
  - key: "M3"
    title: "M3 — Complete Month 1 Workspace"
    description: "Specialized SQL, reading, cases, writing, career, portfolio, reports, weekly/month transition behavior"
  - key: "M4"
    title: "M4 — Production and Portability"
    description: "Dedicated hardened server, restore-tested backups, complete export, optional OKF, failure/security/evaluation gates, release runbook"

