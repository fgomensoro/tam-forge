services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tamforge
      POSTGRES_USER: tamforge
      POSTGRES_PASSWORD: tamforge
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tamforge-postgres:/var/lib/postgresql/data

  minio:
    image: docker.io/bitnamilegacy/minio:2024.6.13@sha256:aa1752895e6d2b420e394d55241d5b2c948960715db0a50bb648f430e447e645
    command: minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tamforge
      MINIO_ROOT_PASSWORD: tamforge-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - tamforge-minio:/bitnami/minio/data

volumes:
  tamforge-postgres:
  tamforge-minio:
