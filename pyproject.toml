[project]
name = "tam-forge-workspace"
version = "0.1.0"
description = "TAM Forge private learning workspace"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[tool.uv.workspace]
members = ["apps/backend", "packages/protocol"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
  "integration: tests that require external services",
]
pythonpath = ["."]
testpaths = [
  "apps/backend/tests",
  "packages/protocol/tests",
  "scripts/dev/tests",
  "scripts/github/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["apps/backend/src", "packages/protocol/src", "scripts/github"]
