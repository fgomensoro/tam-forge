[project]
name = "tam-forge-workspace"
version = "0.1.0"
description = "TAM Forge private learning workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/backend", "packages/protocol"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require external services",
]
testpaths = ["apps/backend/tests", "packages/protocol/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/backend/src", "packages/protocol/src"]
