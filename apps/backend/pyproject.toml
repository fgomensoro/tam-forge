[project]
name = "tamforge-backend"
version = "0.1.0"
description = "TAM Forge FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4,<5",
  "asyncpg>=0.30,<1",
  "authlib>=1.6,<2",
  "boto3>=1.43,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.43,<2",
  "mypy>=1.15,<2",
  "moto[s3]>=5.2,<6",
  "pytest>=8.3,<9",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamforge_backend"]
