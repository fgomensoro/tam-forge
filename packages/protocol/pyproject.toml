[project]
name = "tamforge-protocol"
version = "0.1.0"
description = "Shared TAM Forge protocol types"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12.5,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamforge_protocol"]
