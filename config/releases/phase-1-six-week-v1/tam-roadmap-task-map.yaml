contracts:
  tasks:
    interview:
      required_output:
      - Independent Attempt A, coaching handoff, and separate Attempt B.
      pass_criteria:
      - Commit Attempt A before coaching.
      evidence_requirements:
      - Attempt record and handoff.
      procedure:
      - phase: interview_cycle
        minutes: 60
        requirement: Independent Attempt A, coaching handoff, and separate Attempt B.
      constraints:
      - Coached Attempt B cannot raise the demonstrated level.
    sealed_interview:
      required_output:
      - Sealed 45-minute final mock and self-review.
      pass_criteria:
      - No coaching before or during the mock.
      evidence_requirements:
      - Sealed recording and score.
      procedure:
      - phase: sealed_final_mock
        minutes: 60
        requirement: Sealed 45-minute final mock and self-review.
      constraints:
      - No Attempt B in the same session.
    pipeline:
      required_output:
      - One or more quality pipeline actions.
      pass_criteria:
      - Only complete actions with every required field count.
      evidence_requirements:
      - Pipeline action records.
      procedure:
      - phase: pipeline
        minutes: 30
        requirement: One or more quality pipeline actions.
      constraints:
      - Two actions are a default, not a daily gate.
    roadmap:
      required_output:
      - Assigned roadmap artifact and exact checkpoint.
      pass_criteria:
      - Produce the assigned output within the block.
      evidence_requirements:
      - Artifact and evidence links.
      procedure:
      - phase: roadmap_unit
        minutes: 75
        requirement: Assigned roadmap artifact and exact checkpoint.
      constraints:
      - Stop at 75 minutes; one due correction may use at most ten minutes.
      correction_selection:
        source: due_corrections
        maximum_items: 1
        maximum_minutes: 10
        allowed_kinds:
        - spoken_attempt_b
        - written_attempt_b
        - targeted_sql_correction
        inherits_core_prompt: true
        inherits_original_exercise: true
        inherits_original_mapping_version: true
        no_attempt_c: true
        skill_level_effect: none
    close:
      required_output:
      - Daily scorecard, recall items, evidence map, and exact next action.
      pass_criteria:
      - Use the 5/5/3/2 close vector.
      evidence_requirements:
      - Daily index and scorecard.
      procedure:
      - phase: daily_close
        minutes: 15
        requirement: Daily scorecard, recall items, evidence map, and exact next action.
      constraints:
      - Do not extend the day.
    saturday:
      required_output:
      - The named independent Saturday assessment segment.
      pass_criteria:
      - Respect the exact segment timebox and assistance rule.
      evidence_requirements:
      - Assessment artifact and score.
      procedure:
      - phase: saturday_assessment
        minutes: 120
        requirement: The named independent Saturday assessment segment.
      constraints:
      - Saturday never absorbs weekday backlog.
  interview_cycle:
    kind: ordinary_interview
    total_minutes: 60
    steps:
    - step_key: frame
      minutes: 5
      assistance: none
    - step_key: independent_attempt_a
      minutes: 15
      assistance: none
    - step_key: self_review
      minutes: 5
      assistance: none
    - step_key: codex_coaching
      minutes: 20
      assistance: coach_after_attempt_a
      fresh_codex_task: true
    - step_key: separate_attempt_b
      minutes: 5
      assistance: none
      after_coach_handoff: true
    - step_key: save_handoff_and_notes
      minutes: 10
      assistance: analyst
    attempt_b:
      separate_from_coach_task: true
      same_question_as_attempt_a: true
      qualifying_for_level: false
    coach_handoff:
      required_before_attempt_b: true
      coach_must_not_claim_attempt_b: true
  sealed_final_mock:
    kind: sealed_final_mock
    total_minutes: 60
    queue_ordinal: 30
    fixed_local_date: '2026-10-02'
    coaching_allowed: false
    attempt_b_allowed: false
    steps:
    - step_key: setup
      minutes: 5
      assistance: none
    - step_key: sealed_mock
      minutes: 45
      assistance: none
    - step_key: save_and_self_review
      minutes: 10
      assistance: none
  pipeline:
    kind: multi_action_pipeline
    output_contract_version: 2
    weekly_quality_target: 10
    default_weekday_actions: 2
    daily_pass_fail: false
    action_types:
    - application
    - recruiter_reply
    required_fields:
    - company
    - role
    - context_snapshot_ref
    - relevance
    - known_gap
    - resume_or_story_version
    - completed_action
    - completed_on
    - current_stage
    - next_action
    nonqualifying_reasons:
    - simple_acknowledgement
    - research_without_required_artifact
    conversion_stages:
    - applied
    - recruiter_contact
    - recruiter_screen
    - hiring_manager_interview
    - next_round
    - offer
    - rejected
    - no_response
    - withdrawn
