interview_queue:
- ordinal: 1
  segment: 1
  question_key: p1_q01
  selection_mode: ordered
  prompt: Tell me about yourself.
- ordinal: 2
  segment: 1
  question_key: p1_q02
  selection_mode: ordered
  prompt: What is your current role and scope?
- ordinal: 3
  segment: 1
  question_key: p1_q03
  selection_mode: ordered
  prompt: Why do you want to become a Technical Account Manager?
- ordinal: 4
  segment: 1
  question_key: p1_q04
  selection_mode: ordered
  prompt: Why are you considering a change now?
- ordinal: 5
  segment: 1
  question_key: p1_q05
  selection_mode: ordered
  prompt: What is your strongest achievement relevant to this role?
- ordinal: 6
  segment: 2
  question_key: p1_q06
  selection_mode: ordered
  prompt: Why this company?
- ordinal: 7
  segment: 2
  question_key: p1_q07
  selection_mode: ordered
  prompt: Tell me about a difficult customer.
- ordinal: 8
  segment: 2
  question_key: p1_q08
  selection_mode: ordered
  prompt: Tell me about a conflict you handled.
- ordinal: 9
  segment: 2
  question_key: p1_q09
  selection_mode: ordered
  prompt: Tell me about a failure and what you learned.
- ordinal: 10
  segment: 2
  question_key: p1_q10
  selection_mode: ordered
  prompt: How do you prioritize when requirements are ambiguous?
- ordinal: 11
  segment: 3
  question_key: p1_q11
  selection_mode: ordered
  prompt: Tell me about a major incident you handled.
- ordinal: 12
  segment: 3
  question_key: p1_q12
  selection_mode: ordered
  prompt: How would you troubleshoot a failing API integration?
- ordinal: 13
  segment: 3
  question_key: p1_q13
  selection_mode: ordered
  prompt: How do you communicate when the ETA is uncertain?
- ordinal: 14
  segment: 3
  question_key: p1_q14
  selection_mode: ordered
  prompt: How would you explain payments and reconciliation to a customer?
- ordinal: 15
  segment: 3
  question_key: p1_q15
  selection_mode: ordered
  prompt: How do you prioritize competing customers?
- ordinal: 16
  segment: 4
  question_key: p1_q16
  selection_mode: ordered
  prompt: Explain APIs and webhooks to a non-technical customer.
- ordinal: 17
  segment: 4
  question_key: p1_q17
  selection_mode: ordered
  prompt: How do OAuth and API security work?
- ordinal: 18
  segment: 4
  question_key: p1_q18
  selection_mode: ordered
  prompt: Explain idempotency and safe retries.
- ordinal: 19
  segment: 4
  question_key: p1_q19
  selection_mode: ordered
  prompt: How do observability and SLOs help customers?
- ordinal: 20
  segment: 4
  question_key: p1_q20
  selection_mode: ordered
  prompt: How do you evaluate architecture trade-offs?
- ordinal: 21
  segment: 5
  question_key: p1_q21
  selection_mode: ordered
  prompt: Tell me about leading an implementation.
- ordinal: 22
  segment: 5
  question_key: p1_q22
  selection_mode: ordered
  prompt: How do you make a launch decision?
- ordinal: 23
  segment: 5
  question_key: p1_q23
  selection_mode: ordered
  prompt: How would you build a proactive account strategy?
- ordinal: 24
  segment: 5
  question_key: p1_q24
  selection_mode: ordered
  prompt: How do you communicate technical risk to executives?
- ordinal: 25
  segment: 5
  question_key: p1_q25
  selection_mode: ordered
  prompt: Tell me about influencing without authority.
- ordinal: 26
  segment: 6
  question_key: p1_q26
  selection_mode: ordered
  prompt: Prepare for the selected company's recruiter screen.
- ordinal: 27
  segment: 6
  question_key: p1_q27
  selection_mode: ordered
  prompt: Complete a fresh behavioral interview round.
- ordinal: 28
  segment: 6
  question_key: p1_q28
  selection_mode: ordered
  prompt: Complete a Technical TAM interview round.
- ordinal: 29
  segment: 6
  question_key: p1_q29
  selection_mode: ordered
  prompt: Complete the portfolio and customer simulation.
- ordinal: 30
  segment: 6
  question_key: p1_q30
  selection_mode: fixed_event
  fixed_local_date: '2026-10-02'
  prompt: Complete the sealed 45-minute final mock.
