schema_version: 1
roadmap_version: month-1-v2
mapping_version: seed-v1
month: 1
default_required: true

contracts:
  sql:
    required_output: [Saved query and result., Explanation of query logic and business meaning., Self-review with timing and assistance used.]
    pass_criteria: [Commit the answer without AI before review; AI remains locked until commitment or the 30-minute solving phase expires., Validate the result and classify mistakes using the approved SQL categories.]
    evidence_requirements: [Original query and result., Business explanation., Self-review., Elapsed time., Assistance mode and hint-ladder level if used.]
    procedure:
      - {phase: retrieval, minutes: 5, requirement: Retrieve one previous SQL mistake.}
      - {phase: primary_work, minutes: 30, requirement: Solve the assigned exercise without AI.}
      - {phase: validation_explanation, minutes: 5, requirement: Validate the result and explain query logic plus business meaning.}
      - {phase: self_review_save, minutes: 5, requirement: Complete self-review and save all evidence.}
    constraints: [Use the ordered hint ladder only after the independent attempt is committed or time expires., Saturday SQL remains no-AI and is the demonstrated assessment.]
  technical:
    required_output: [Committed closed-source recall note with three key ideas, one boundary or failure mode, one TAM or customer example, and one unresolved question., Application artifact named in the task objective., Teach-back explanation.]
    pass_criteria: [Use only the assigned documentation during focused reading., Hide the source before recall and commit the learner-authored note before AI evaluation., Explain the concept accurately without replacing the note with an AI summary.]
    evidence_requirements: [Assigned source reference., Original closed-source recall note., Application artifact., Teach-back., Commitment timestamp and unresolved question.]
    procedure:
      - {phase: preview, minutes: 2, requirement: Preview the objective.}
      - {phase: focused_reading, minutes: 20, requirement: Read only the assigned documentation.}
      - {phase: closed_source_recall, minutes: 8, requirement: Hide the source and write the required recall note.}
      - {phase: application, minutes: 10, requirement: Apply the concept to the assigned TAM context.}
      - {phase: teach_back, minutes: 5, requirement: Explain the concept aloud or in writing.}
    constraints: [AI evaluates only after the recall note is committed., AI must not replace the learner-authored note with a generated summary.]
  pipeline:
    required_output: [Concrete saved application, research, resume, outreach, follow-up, job mapping, product research, or interview-preparation artifact.]
    pass_criteria: [Finish with a usable saved action or artifact; browsing or planning alone is incomplete.]
    evidence_requirements: [Company and role., Job-description snapshot., Completed action., Current stage and next action., Relevant stories and competencies., Known gaps and related interviews.]
    procedure:
      - {phase: select, minutes: 5, requirement: Select the highest-value career action.}
      - {phase: produce, minutes: 20, requirement: Produce the concrete action or artifact.}
      - {phase: record, minutes: 5, requirement: 'Save opportunity context, outcome, and next action.'}
    constraints: [Active opportunities may shape upcoming practice but must not rewrite required roadmap coverage or time.]
  correction:
    required_output: [One saved Spoken Attempt B, Written Attempt B, or targeted SQL correction inherited from a due correction.]
    pass_criteria: [Complete exactly one carryover within ten minutes using the same core prompt when Attempt B applies., Stop after Attempt B; no Attempt C is allowed.]
    evidence_requirements: [Source correction ID., Original Attempt A or SQL mistake link., Correction kind., Saved correction output., Elapsed time and comparison eligibility.]
    procedure:
      - {phase: select_due_correction, minutes: 1, requirement: Select exactly one highest-priority due correction.}
      - {phase: correction_attempt, minutes: 9, requirement: Complete the inherited correction without interruption.}
    constraints: [Never schedule spoken, written, and SQL corrections together., The warm-up has no skill-level effect; later transfer requires a new independent Attempt A.]
    correction_selection:
      source: due_corrections
      maximum_items: 1
      allowed_kinds: [spoken_attempt_b, written_attempt_b, targeted_sql_correction]
      inherits_core_prompt: true
      no_attempt_c: true
      skill_level_effect: none
  case:
    required_output: [Discovery questions and explicit assumptions., Structured working analysis., Final recommendation or artifact., Presentation and defense with no more than two routine follow-ups., Mandatory self-review.]
    pass_criteria: [Commit an independent answer for the stated scenario and audience before feedback., Separate canonical facts from assumptions and preserve cumulative case history., Move a weak segment to a future correction or new scenario instead of repeating the entire case.]
    evidence_requirements: [Canonical prompt and facts., Questions and assumptions., Working notes., Final artifact., Presentation audio and transcript., Follow-up answers., Self-review and analysis., Decisions, risks, and unresolved questions.]
    procedure:
      - {phase: understand, minutes: 5, requirement: 'Identify scenario, audience, canonical facts, and objective.'}
      - {phase: discovery, minutes: 10, requirement: Ask discovery questions and separate facts from assumptions.}
      - {phase: structure, minutes: 5, requirement: Structure the approach before solving.}
      - {phase: solve_produce, minutes: 25, requirement: Produce the recommendation or required artifact.}
      - {phase: present_defend, minutes: 10, requirement: 'Present, defend, and answer at most two routine follow-ups.'}
      - {phase: self_review, minutes: 5, requirement: Complete the mandatory self-review.}
    constraints: [No coaching or interruption during saved Attempt A., AI may not silently change canonical facts or prior cumulative decisions.]
  communication:
    required_output: [Saved independent spoken or written Attempt A for the stated audience, purpose, and limit., Mandatory self-review completed before AI feedback.]
    pass_criteria: [Establish audience, requested action, facts, unknowns, tone, and limit before writing or speaking., Commit Attempt A without mid-attempt coaching and perform at most one self-edit for writing.]
    evidence_requirements: [Prompt, audience, objective, and limit., Original output and duration or length., Self-review., Audio and transcript when spoken., Assistance mode.]
    procedure:
      - {phase: frame, requirement: 'Establish audience, action, facts, unknowns, tone, and limit.'}
      - {phase: attempt_a, requirement: Produce and commit an independent response without interruption.}
      - {phase: self_review, requirement: Complete the mandatory self-review before AI feedback.}
    constraints: [AI must not invent experience, metrics, decisions, or technical evidence., AI feedback is asynchronous and returns exactly two highest-impact corrections., Attempt B uses a future correction slot and stops after one revision.]
  close:
    required_output: [Completed daily scorecard and unfinished-work classification.]
    pass_criteria: [Record strongest evidence, repeated mistake, and no more than two corrections.]
    evidence_requirements: [Scorecard, evidence links, correction selections, unfinished requirement.]
    procedure:
      - {phase: daily_close, minutes: 15, requirement: 'Confirm evidence, strongest output, repeated mistake, unfinished classification, and at most two corrections.'}
    constraints: [Do not extend the day or invent work to fill unused time., Required, useful, optional, and superseded work follow the approved rescheduling policy.]
  saturday_sql:
    required_output: [No-AI SQL answers and results completed within 30 minutes.]
    pass_criteria: [Stop at 30 minutes and score only independently completed answers.]
    evidence_requirements: [Queries, results, correctness, elapsed time, no-AI attestation.]
    procedure: [{phase: timed_sql, minutes: 30, requirement: Complete and validate no-AI SQL work.}]
    constraints: [Stop at thirty minutes and score only demonstrated independent work.]
  saturday_case:
    required_output: [Independent case artifact, presentation, and self-review.]
    pass_criteria: [Complete the stated case stages within the fixed assessment time.]
    evidence_requirements: [Prompt, facts, assumptions, artifact, Attempt A, self-review.]
    procedure: [{phase: assessed_case, requirement: Complete the assigned independent case stages within its fixed task timebox.}]
    constraints: [No Coach Mode or mid-attempt AI is allowed during assessment.]
  saturday_portfolio:
    required_output: [Ranked portfolio, ownership, delegation, communication, and reversal conditions.]
    pass_criteria: [Prioritize explicitly, cover every customer, and adapt after new evidence.]
    evidence_requirements: [Initial ranking, rationale, allocation, communications, revised ranking.]
    procedure: [{phase: assessed_portfolio, requirement: 'Rank, allocate, communicate, and reprioritize after new evidence.'}]
    constraints: [The largest or loudest customer is not automatically priority one., No Coach Mode or mid-attempt AI is allowed.]
  saturday_writing:
    required_output: [Timed customer and executive writing named in the objective.]
    pass_criteria: [Complete both audience-specific artifacts within the fixed time.]
    evidence_requirements: [Original drafts, audience, time limit, elapsed time, self-review.]
    procedure: [{phase: assessed_writing, requirement: Produce the required audience-specific writing within the fixed task timebox.}]
    constraints: [No AI drafting or invented facts are allowed.]
  saturday_behavioral:
    required_output: [Independent behavioral answers and follow-up responses.]
    pass_criteria: [Answer each prompt with concrete personal evidence and within the fixed time.]
    evidence_requirements: [Prompts, Attempt A recordings or text, follow-ups, self-review.]
    procedure: [{phase: assessed_behavioral, requirement: Answer independently and complete the required follow-ups and self-review.}]
    constraints: [Use only true personal evidence and do not memorize an AI-generated answer.]
  saturday_gauntlet:
    required_output: [Independently scored child artifacts for every gauntlet component.]
    pass_criteria: [Complete portfolio-to-depth work in English without copying one score across children.]
    evidence_requirements: [Each child prompt, output, score, timing, and final self-review.]
    procedure: [{phase: integrated_gauntlet, requirement: Complete and score each required child component independently.}]
    constraints: [Do not copy one overall score across child skills., No Coach Mode or mid-attempt AI is allowed.]
  saturday_scoring:
    required_output: [Completed weekly or month assessment with evidence-linked priorities.]
    pass_criteria: [Use demonstrated evidence rather than confidence and select only stated priorities.]
    evidence_requirements: [Assessment scores, evidence links, mistakes, next priorities.]
    procedure: [{phase: evidence_scoring, requirement: Score demonstrated evidence and record the approved number of priorities.}]
    constraints: [Confidence and completion do not replace demonstrated performance.]

reconciliations:
  - slug: day_23_correction_cap
    reviewed: true
    target_task_id: m1-w4-d23-close
    source_path: Week 4 - Integrated interview performance and final assessment.md
    source_heading: Day 23 — Dress rehearsal and final behavioral assessment
    original_source_text: Select exactly three corrections for the final Saturday assessment.
    executable_text: Select no more than two corrections for the final Saturday assessment.
    what_changed: The executable Day 23 close caps selected corrections at two instead of requiring three.
    why_changed: The approved cross-roadmap daily-close and Today-screen invariant permits at most two active corrections.
    evidence: Product architecture Sections 8.1 and 8.3 require at most two corrections; the Day 23 source sentence conflicts with that invariant.
    roadmap_objective: Preserve focused correction carryover without extending time or weakening required final-assessment coverage.
    affects_time: false
    affects_required_coverage: false

