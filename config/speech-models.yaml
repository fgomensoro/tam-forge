# Pinned build artifacts for the local whisper.cpp transcription runtime.
#
# Model artifacts install inside the app's sandbox container, not into
# ~/Library/Application Support. TAMForge.app carries
# com.apple.security.app-sandbox, so SpeechModelCatalog.defaultDirectory
# resolves .applicationSupportDirectory to the container-redirected path;
# a model dropped in the real home directory is invisible to the app and
# transcription silently stays off.
#
# Every pin below (url, bytes, sha256) was reviewed by hand. Changing any pin
# requires re-running both scripts/dev/fetch_whisper_framework.sh and
# scripts/dev/fetch_whisper_models.sh, and re-reviewing the new artifact
# (provenance, license, hash) before committing the change.
schema_version: 1
artifacts:
  whisper_framework:
    version: b4938
    url: https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-b4938-xcframework.zip
