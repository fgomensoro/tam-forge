    bytes: 53621479
    sha256: dcc6cdc6d6902d11893434ceda70c23a2a64450f65a1b570035c9908988dfedd
    license: MIT
    installs_to: apps/macos/Vendor/whisper.xcframework
    consumed_by: WhisperTranscriber
